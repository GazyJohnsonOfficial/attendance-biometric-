name: student_attendance_mobile
description: "Biometric Class Attendance System - Student Mobile App (Android/Flutter)"
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  google_mlkit_face_detection: ^0.10.0
  camera: ^0.10.5+9
  mobile_scanner: ^5.0.0
  geolocator: ^11.0.0
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
